name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Typecheck + remote-content validation + logic checks. Content in data/ ships to
      # installed apps straight from main, so a bad JSON push must fail here first.
      - run: npm run verify

      - run: npm run lint

      - run: npx expo-doctor

      - run: npm audit --omit=dev --audit-level=high
